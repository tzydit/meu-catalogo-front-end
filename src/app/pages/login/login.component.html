<div class="flex flex-col items-center justify-center min-h-[60vh]">
  <div class="w-full max-w-sm bg-gray-900 dark:bg-gray-950 rounded-xl shadow-lg p-8 border border-gray-800">
    <h2 class="text-2xl font-bold text-pink-400 mb-6 text-center">Entrar</h2>
    <form (submit)="login($event)">
      <div class="mb-4">
        <label class="block text-gray-300 mb-1" for="email">E-mail</label>
        <input id="email" name="email" [(ngModel)]="email" type="email" class="w-full px-3 py-2 rounded bg-gray-800 text-gray-100 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="Seu e-mail" required />
      </div>
      <div class="mb-6">
        <label class="block text-gray-300 mb-1" for="password">Senha</label>
        <input id="password" name="password" [(ngModel)]="password" type="password" class="w-full px-3 py-2 rounded bg-gray-800 text-gray-100 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="Sua senha" required />
      </div>
      <button type="submit" class="w-full py-2 rounded bg-pink-500 hover:bg-pink-600 text-white font-semibold transition">Entrar</button>
      <div *ngIf="error" class="text-red-400 text-sm mt-2 text-center">{{ error }}</div>
    </form>
    <div class="mt-4 text-center">
      <span class="text-gray-400">Não tem conta?</span>
      <a routerLink="/register" class="text-pink-400 hover:underline ml-1">Cadastre-se</a>
    </div>
  </div>
</div>
