<div class="flex flex-col items-center justify-center min-h-[60vh]">
  <div class="w-full max-w-sm bg-gray-900 dark:bg-gray-950 rounded-xl shadow-lg p-8 border border-gray-800">
    <h2 class="text-2xl font-bold text-pink-400 mb-6 text-center">Criar Conta</h2>
    <form>
      <div class="mb-4">
        <label class="block text-gray-300 mb-1" for="name">Nome</label>
        <input id="name" type="text" class="w-full px-3 py-2 rounded bg-gray-800 text-gray-100 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="Seu nome" required />
      </div>
      <div class="mb-4">
        <label class="block text-gray-300 mb-1" for="email">E-mail</label>
        <input id="email" type="email" class="w-full px-3 py-2 rounded bg-gray-800 text-gray-100 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="Seu e-mail" required />
      </div>
      <div class="mb-6">
        <label class="block text-gray-300 mb-1" for="password">Senha</label>
        <input id="password" type="password" class="w-full px-3 py-2 rounded bg-gray-800 text-gray-100 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="Crie uma senha" required />
      </div>
      <button type="submit" class="w-full py-2 rounded bg-pink-500 hover:bg-pink-600 text-white font-semibold transition">Cadastrar</button>
    </form>
    <div class="mt-4 text-center">
      <span class="text-gray-400">Já tem conta?</span>
      <a routerLink="/login" class="text-pink-400 hover:underline ml-1">Entrar</a>
    </div>
  </div>
</div>
